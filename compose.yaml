services:
  gateway:
    build: ./gateway
    stop_grace_period: 5s
    volumes:
      - ./gateway/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - public_net
      - private_net

  claude-code: &cli_tool
    build:
      context: .
      dockerfile: node-tool.Dockerfile
      args:
        NPM_PACKAGE: "@anthropic-ai/claude-code"
    profiles: ["cli"] # Prevents auto-start with 'docker compose up'
    networks:
      - private_net
    environment:
      https_proxy: http://gateway:3128
      http_proxy: http://gateway:3128
    entrypoint: ["bash", "-c"]
    depends_on:
      - gateway

  opencode:
    <<: *cli_tool
    build:
      context: .
      dockerfile: node-tool.Dockerfile
      args:
        NPM_PACKAGE: opencode-ai

  aider:
    <<: *cli_tool
    build:
      context: .
      dockerfile: python-tool.Dockerfile
      args:
        PIP_PACKAGE: aider-chat

  goose:
    <<: *cli_tool
    build:
      context: .
      dockerfile: debian-tool.Dockerfile
      args:
        INSTALL_COMMAND: curl -fsSL https://github.com/aaif-goose/goose/releases/download/stable/download_cli.sh | CONFIGURE=false bash

  pi:
    <<: *cli_tool
    build:
      context: .
      dockerfile: node-tool.Dockerfile
      args:
        NPM_PACKAGE: "@mariozechner/pi-coding-agent"
        POST_INSTALL_SCRIPT: |-
          echo "No extra pi packages yet."

networks:
  public_net:
    driver: bridge
  private_net:
    internal: true # Air-gap for the CLI tools

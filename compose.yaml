services:
  gateway:
    build: ./gateway
    networks:
      - public_net
      - private_net

  claude-code: &cli_tool
    build:
      context: .
      dockerfile: claude-code.Dockerfile
    profiles: ["cli"] # Prevents auto-start with 'docker compose up'
    networks:
      - private_net
    depends_on:
      - gateway

  opencode:
    <<: *cli_tool
    build:
      dockerfile: opencode.Dockerfile

networks:
  public_net:
    driver: bridge
  private_net:
    internal: true # Air-gap for the CLI tools
